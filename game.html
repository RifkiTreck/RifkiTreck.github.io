<!DOCTYPE html>
<html>
<head>
<title>TEBAK OUTPUT KODE V2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#00ff88;font-family:'Orbitron', monospace;text-align:center;padding:20px;background: linear-gradient(45deg, #0a0a0a, #1a0033, #0a0a0a);background-size:400% 400%;animation:gradient 10s ease infinite;}
@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
h1{color:#ff00ff;font-size:28px;text-shadow:0 0 10px #ff00ff;animation:glow 2s ease-in-out infinite alternate;margin-bottom:20px;}
@keyframes glow{from{text-shadow:0 0 10px #ff00ff}to{text-shadow:0 0 20px #ff00ff, 0 0 40px #ff00ff}}
.info{display:flex;justify-content:space-around;margin-bottom:15px;font-size:18px}
#skor{color:#00ffff;text-shadow:0 0 5px #00ffff}
#nyawa{color:#ff0044;text-shadow:0 0 5px #ff0044}
#timer{color:#ffff00;text-shadow:0 0 5px #ffff00;font-size:20px;margin-bottom:20px}
.box{border:2px solid #00ff88;padding:20px;margin:20px auto;max-width:450px;font-size:20px;background:rgba(0,255,136,0.1);border-radius:10px;box-shadow:0 0 20px #00ff88;}
.btn{padding:15px 30px;margin:10px;border:2px solid #00ff88;background:transparent;color:#00ff88;font-size:18px;font-family:'Orbitron';cursor:pointer;border-radius:8px;transition:all 0.3s;}
.btn:hover{background:#00ff88;color:#000;box-shadow:0 0 20px #00ff88;transform:scale(1.1);}
.gameover{font-size:30px;color:#ff0044;animation:blink 1s infinite;}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<h1>🔥 TEBAK OUTPUT KODE 🔥</h1>
<div class="info"><div id="skor">Skor: 0</div><div id="nyawa">Nyawa: 3 ❤️</div></div>
<div id="timer">Waktu: 10s</div>
<div class="box" id="soal">Loading...</div>
<div id="tombol"></div>

<script>
let soal = [
 {kode:'console.log("10" + 5);',jawaban:'105',opsi:['15','105','Error']},
 {kode:'console.log(2+2*2);',jawaban:'6',opsi:['8','6','4']},
 {kode:'console.log(typeof 5);',jawaban:'number',opsi:['number','string','int']},
 {kode:'console.log("5" - 2);',jawaban:'3',opsi:['3','52','Error']},
 {kode:'console.log(true + true);',jawaban:'2',opsi:['1','2','true']}
];
let skor=0, nyawa=3, noSoal=0, waktu=10, timer;

function mulaiTimer(){
 waktu=10;
 document.getElementById('timer').innerText='Waktu: '+waktu+'s';
 timer=setInterval(()=>{
  waktu--;
  document.getElementById('timer').innerText='Waktu: '+waktu+'s';
  if(waktu<=0){clearInterval(timer);salah();}
 },1000);
}

function tampilSoal(){
 if(nyawa<=0){document.getElementById('soal').innerHTML='<div class="gameover">GAME OVER!</div>';document.getElementById('tombol').innerHTML='<button class="btn" onclick="location.reload()">MAIN LAGI</button>';return}
 if(noSoal>=soal.length){document.getElementById('soal').innerHTML='<div class="gameover" style="color:#00ff88">KAMU MENANG!</div>';document.getElementById('tombol').innerHTML='<button class="btn" onclick="location.reload()">MAIN LAGI</button>';return}
 let s=soal[noSoal];
 document.getElementById('soal').innerText=s.kode;
 document.getElementById('skor').innerText='Skor: '+skor;
 document.getElementById('nyawa').innerText='Nyawa: '+nyawa+' ❤️';
 let btn='';
 for(let i=0;i<s.opsi.length;i++){btn+='<button class="btn" onclick="cek(\''+s.opsi[i]+'\')">'+s.opsi[i]+'</button>'}
 document.getElementById('tombol').innerHTML=btn;
 mulaiTimer();
}

function cek(jawaban){clearInterval(timer);if(jawaban==soal[noSoal].jawaban){skor++;noSoal++;setTimeout(tampilSoal,500);}else{salah();}}
function salah(){clearInterval(timer);nyawa--;noSoal++;setTimeout(tampilSoal,800);}
tampilSoal();
</script>
</body>
</html>
