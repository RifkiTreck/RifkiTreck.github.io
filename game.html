<!DOCTYPE html>
<html>
<head>
<title>RC.COODING SHOOTER LANDSCAPE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="screen-orientation" content="landscape">
<style>
body{margin:0;background:#200;overflow:hidden;font-family:sans-serif}
canvas{background:linear-gradient(#400,#000);display:block}
#controls{position:absolute;bottom:30px;left:30px;display:flex;gap:15px}
.btn{width:70px;height:70px;background:rgba(255,255,255,0.2);border:3px solid white;border-radius:50%;color:white;font-size:24px}
#shoot{position:absolute;right:30px;bottom:80px;width:90px;height:90px;background:radial-gradient(red,darkred);font-size:16px}
#info{position:absolute;top:10px;left:10px;color:white;background:rgba(0,0,0,0.5);padding:5px 10px;border-radius:5px}
@media screen and (orientation: portrait) {
  body:before{content:"PUTAR HP KE SAMPING";position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  color:white;font-size:30px;background:red;padding:20px;border-radius:10px;z-index:999}
  canvas, #controls, #shoot{display:none}
}
</style>
</head>
<body>
<div id="info">RC.COODING SHOOTER</div>
<canvas id="game"></canvas>
<div id="controls">
  <button class="btn" id="left">◀</button>
  <button class="btn" id="right">▶</button>
  <button class="btn" id="jump">▲</button>
</div>
<button class="btn" id="shoot">TEMBAK</button>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = innerWidth; canvas.height = innerHeight;

let player = {x:100,y:canvas.height-120,w:40,h:60,vy:0,speed:5};
let bullets = []; 
let enemies = []; for(let i=0;i<3;i++) enemies.push({x:400+i*200,y:canvas.height-120,hp:2});
let keys = {}; let score = 0;

// Kontrol
['left','right','jump','shoot'].forEach(id=>{
  document.getElementById(id).ontouchstart = () => keys[id]=1;
  document.getElementById(id).ontouchend = () => keys[id]=0;
})

function update(){
  if(keys.left) player.x-=player.speed;
  if(keys.right) player.x+=player.speed;
  if(keys.jump && player.y>=canvas.height-120){player.vy=-18; keys.jump=0;}
  
  player.vy+=0.6; player.y+=player.vy;
  if(player.y>canvas.height-120) player.y=canvas.height-120;

  if(keys.shoot){ bullets.push({x:player.x+40,y:player.y+25,dx:12}); keys.shoot=0; }

  bullets.forEach(b=>b.x+=b.dx);
  bullets = bullets.filter(b=>b.x<canvas.width);

  enemies.forEach(e=>{
    bullets.forEach(b=>{
      if(Math.abs(b.x-e.x)<35 && Math.abs(b.y-e.y)<30){ e.hp--; b.x=9999; }
    })
  })
  enemies = enemies.filter(e=>e.hp>0);
  score = 3 - enemies.length;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#300"; ctx.fillRect(0,canvas.height-100,canvas.width,100); // tanah
  
  // Player biru
  ctx.fillStyle="#00aaff"; ctx.fillRect(player.x,player.y,player.w,player.h);
  // Musuh hijau
  ctx.fillStyle="#00ff00"; enemies.forEach(e=>ctx.fillRect(e.x,e.y,35,60));
  // Peluru kuning
  ctx.fillStyle="yellow"; bullets.forEach(b=>ctx.fillRect(b.x,b.y,12,5));
  
  // Score
  ctx.fillStyle="white"; ctx.font="20px Arial"; ctx.fillText("Score: "+score, 20, 40);
  
  if(enemies.length==0){
    ctx.fillStyle="orange"; ctx.font="60px Arial"; 
    ctx.fillText("MENANG!", canvas.width/2-120, 100);
  }
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
