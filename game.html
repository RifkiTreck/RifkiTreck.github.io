<!DOCTYPE html>
<html><head><title>RC SHOOTER V10 HD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
body{margin:0;background:linear-gradient(#200,#000);overflow:hidden}
canvas{display:block}
#controls{position:absolute;bottom:40px;left:40px;display:flex;gap:20px}
.btn{width:80px;height:80px;background:rgba(255,255,255,0.2);border:3px solid white;border-radius:50%;color:white;font-size:28px;touch-action:none;box-shadow:0 0 15px rgba(255,255,255,0.3)}
#shoot{position:absolute;right:30px;bottom:70px;width:100px;height:100px;background:rgba(255,0,0,0.9);font-size:18px;font-weight:bold;box-shadow:0 0 20px red}
#info{position:absolute;top:10px;left:15px;color:white;background:rgba(0,0,0,0.7);padding:10px 20px;border-radius:12px;font-size:20px;font-family:Arial;font-weight:bold}
</style></head>
<body>
<div id="info">RC SHOOTER V10 HD | Score: 0 | Nyawa: 3</div>
<canvas id="game"></canvas>
<div id="controls"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button><button class="btn" id="jump">▲</button></div>
<button class="btn" id="shoot">TEMBAK</button>
<audio id="sfx_tembak" src="data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAIARKwAAESsAAABAAZGF0YQAAAAA="></audio>
<audio id="sfx_ledak" src="data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAIARKwAAESsAAABAAZGF0YQAAAAA="></audio>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),info=document.getElementById('info');
const sfxTembak=document.getElementById('sfx_tembak'), sfxLedak=document.getElementById('sfx_ledak');
c.width=innerWidth;c.height=innerHeight;

let kamera=0;

// CARAKTER LEBIH REALISTIS HD
function drawPlayer(x,y){
  ctx.fillStyle="#0044ff"; ctx.fillRect(x+12,y+22,26,28); // badan armor
  ctx.fillStyle="#ffdbac"; ctx.fillRect(x+16,y+8,18,16); // kepala
  ctx.fillStyle="black"; ctx.fillRect(x+38,y+28,18,6); // senjata panjang
  ctx.fillStyle="#333"; ctx.fillRect(x+10,y+50,12,12); // kaki
  ctx.fillRect(x+28,y+50,12,12);
}
function drawEnemy(x,y){
  ctx.fillStyle="#00cc00"; ctx.fillRect(x+8,y+18,24,32); // badan
  ctx.fillStyle="#dd0000"; ctx.fillRect(x+12,y+6,16,14); // kepala helm
  ctx.fillStyle="black"; ctx.fillRect(x-8,y+28,16,6); // senjata
  ctx.fillStyle="#555"; ctx.fillRect(x+6,y+50,10,10); // kaki
  ctx.fillRect(x+24,y+50,10,10);
}
function drawBullet(x,y){
  ctx.fillStyle="yellow"; ctx.shadowBlur=10; ctx.shadowColor="yellow"; 
  ctx.fillRect(x,y,14,5);
  ctx.shadowBlur=0;
}

let p={x:100,y:c.height-120,w:50,h:60,vy:0,s:6},b=[],e=[],eb=[],ex=[],keys={},score=0,nyawa=3;
for(let i=0;i<40;i++)e.push({x:800+i*300,y:c.height-120,hp:3}); // HP 3 = LEBIH SUSAH
['left','right','jump'].forEach(id=>{document.getElementById(id).ontouchstart=()=>keys[id]=1;document.getElementById(id).ontouchend=()=>keys[id]=0;})
document.getElementById('shoot').onclick=()=>{b.push({x:p.x+50,y:p.y+30,dx:15});sfxTembak.play();} // ADA SUARA
c.onclick=()=>location.reload();

function u(){
if(keys.right)p.x+=p.s; 
if(keys.left)p.x-=p.s; if(p.x<0)p.x=0;

if(p.x > c.width/2 + kamera) {kamera = p.x - c.width/2;}
if(p.x < kamera + 100) {kamera = p.x - 100; if(kamera<0)kamera=0;}

if(keys.jump&&p.y>=c.height-120){p.vy=-18;keys.jump=0;}
p.vy+=0.6;p.y+=p.vy;if(p.y>c.height-120)p.y=c.height-120;

// PELURU GA TEMBUS = KENA 1 LANGSUNG HILANG
for(let i=b.length-1;i>=0;i--){
  b[i].x+=b[i].dx;
  let hit=false;
  e.forEach(en=>{
    if(Math.abs(b[i].x-en.x)<35&&Math.abs(b[i].y-en.y)<35){
      en.hp--;hit=true;score++;
      if(en.hp<=0){sfxLedak.play();ex.push({x:en.x+15,y:en.y+30,t:30})}
    }
  })
  if(hit)b.splice(i,1); // PELURU HILANG PAS KENA
}
b=b.filter(bu=>bu.x<kamera+c.width+100);

// MUSUH LEBIH CEPET + NEMBAK LEBIH SERING
e.forEach(en=>{
  en.x -= 2; // LEBIH CEPET
  if(Math.random()<0.05)eb.push({x:en.x,y:en.y+35,dx:-12}); // LEBIH SERING
});
e=e.filter(en=>en.hp>0);

eb.forEach(bu=>bu.x+=bu.dx);eb=eb.filter(bu=>bu.x>kamera-100);
eb.forEach(bu=>{if(Math.abs(bu.x-p.x)<35&&Math.abs(bu.y-p.y)<35){nyawa--;bu.x=9999;if(nyawa<=0)location.reload();}});

ex.forEach(x=>x.t--);ex=ex.filter(x=>x.t>0);
info.innerText=`RC SHOOTER V10 HD | Score: ${score} | Nyawa: ${nyawa}`;}

function d(){
ctx.clearRect(0,0,c.width,c.height);
ctx.save();
ctx.translate(-kamera,0);

// BACKGROUND HD: GUNUNG + TANAH
ctx.fillStyle="#111";
for(let i=0;i<kamera+c.width+1000;i+=100){
  ctx.beginPath();ctx.moveTo(i,c.height-100);ctx.lineTo(i+50,c.height-250);ctx.lineTo(i+100,c.height-100);ctx.fill();
}
ctx.fillStyle="#222";
for(let i=0;i<kamera+c.width+500;i+=60)ctx.fillRect(i,c.height-100,25,100);

drawPlayer(p.x,p.y);
e.forEach(en=>drawEnemy(en.x,en.y));
b.forEach(bu=>drawBullet(bu.x,bu.y));
ctx.fillStyle="red";eb.forEach(bu=>ctx.fillRect(bu.x,bu.y,12,5));
ctx.fillStyle="orange";ex.forEach(x=>{ctx.beginPath();ctx.arc(x.x,x.y,30-x.t,0,6.28);ctx.fill()});

ctx.restore();
}
function l(){u();d();requestAnimationFrame(l)}l();
</script></body></html>
