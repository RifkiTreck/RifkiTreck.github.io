<!DOCTYPE html>
<html>
<head>
<title>TEBAK OUTPUT KODE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#000;color:#0f0;font-family:monospace;text-align:center;padding:20px}
h1{color:#0ff;font-size:24px}
.box{border:2px solid #0f0;padding:15px;margin:20px auto;max-width:400px;font-size:18px}
.btn{padding:12px 25px;margin:8px;border:none;font-size:18px;cursor:pointer;border-radius:5px;font-weight:bold}
.btn:hover{opacity:0.8}
#timer{color:yellow;font-size:20px}
#nyawa{color:red;font-size:20px}
.info{display:flex;justify-content:space-around;margin-bottom:10px}
</style>
</head>
<body>
<h1>🔥 TEBAK OUTPUT KODE 🔥</h1>
<div class="info">
<div id="skor">Skor: 0</div>
<div id="nyawa">Nyawa: 3 ❤️</div>
</div>
<div id="timer">Waktu: 10s</div>

<div class="box" id="soal"></div>
<div id="tombol"></div>

<script>
let soal = [
 {kode:'console.log("10" + 5);',jawaban:'105',opsi:['15','105','Error']},
 {kode:'console.log(2+2*2);',jawaban:'6',opsi:['8','6','4']},
 {kode:'console.log(typeof 5);',jawaban:'number',opsi:['number','string','int']},
 {kode:'console.log("5" - 2);',jawaban:'3',opsi:['3','52','Error']},
 {kode:'console.log(true + true);',jawaban:'2',opsi:['1','2','true']},
];
let skor=0, nyawa=3, noSoal=0, waktu=10, timer;

function mulaiTimer(){
 waktu=10;
 document.getElementById('timer').innerText='Waktu: '+waktu+'s';
 timer=setInterval(()=>{
  waktu--;
  document.getElementById('timer').innerText='Waktu: '+waktu+'s';
  if(waktu<=0){
   clearInterval(timer);
   salah();
  }
 },1000);
}

function tampilSoal(){
 if(nyawa<=0){alert('GAME OVER! Skor akhir: '+skor);location.reload();return}
 if(noSoal>=soal.length){alert('MENANG! Skor akhir: '+skor);location.reload();return}
 
 let s=soal[noSoal];
 document.getElementById('soal').innerText=s.kode;
 document.getElementById('skor').innerText='Skor: '+skor;
 document.getElementById('nyawa').innerText='Nyawa: '+nyawa+' ❤️';
 
 let btn='';
 s.opsi.forEach(o=>{
  btn+=`<button class="btn" style="background:#0f0" onclick="cek('${o}')">${o}</button>`
 })
 document.getElementById('tombol').innerHTML=btn;
 mulaiTimer();
}

function cek(jawaban){
 clearInterval(timer);
 if(jawaban==soal[noSoal].jawaban){
  skor++;
  noSoal++;
  setTimeout(tampilSoal,500);
 }else{
  salah();
 }
}

function salah(){
 clearInterval(timer);
 nyawa--;
 noSoal++;
 setTimeout(tampilSoal,800);
}

tampilSoal();
</script>
</body>
</html>
