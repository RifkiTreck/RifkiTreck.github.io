<!DOCTYPE html>
<html>
<head>
<title>RC.COODING SHOOTER</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
body{margin:0;background:#200;background-size:cover;overflow:hidden}
canvas{background:linear-gradient(#300,#000);display:block}
#controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-between}
.btn{width:60px;height:60px;background:rgba(255,255,255,0.3);border:2px solid white;border-radius:50%;color:white;font-size:20px}
#shoot{position:absolute;right:30px;bottom:80px;width:80px;height:80px;background:red}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="controls">
  <button class="btn" id="left">◀</button>
  <button class="btn" id="right">▶</button>
  <button class="btn" id="jump">▲</button>
</div>
<button class="btn" id="shoot">TEMBAK</button>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = innerWidth; canvas.height = innerHeight;

let player = {x:100,y:canvas.height-100,w:30,h:50,vy:0,dir:1,speed:4};
let bullets = []; let enemies = [{x:400,y:canvas.height-100,hp:3}];
let keys = {};

// Kontrol HP
['left','right','jump','shoot'].forEach(id=>{
  document.getElementById(id).ontouchstart = () => keys[id]=1;
  document.getElementById(id).ontouchend = () => keys[id]=0;
})

function update(){
  // Gerak player
  if(keys.left) player.x-=player.speed;
  if(keys.right) player.x+=player.speed;
  if(keys.jump && player.y>=canvas.height-100) player.vy=-15;
  
  player.vy+=0.5; // gravitasi
  player.y+=player.vy;
  if(player.y>canvas.height-100) player.y=canvas.height-100;

  // Tembak
  if(keys.shoot && bullets.length<5){
    bullets.push({x:player.x+30,y:player.y+20,dx:10});
    keys.shoot=0;
  }

  // Update peluru
  bullets.forEach(b=>b.x+=b.dx);
  bullets = bullets.filter(b=>b.x<canvas.width);

  // Cek tabrakan
  enemies.forEach(e=>{
    bullets.forEach(b=>{
      if(Math.abs(b.x-e.x)<30){ e.hp--; b.x=9999; }
    })
  })
  enemies = enemies.filter(e=>e.hp>0);
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // Tanah
  ctx.fillStyle="#400"; ctx.fillRect(0,canvas.height-80,canvas.width,80);
  // Player kotak biru
  ctx.fillStyle="blue"; ctx.fillRect(player.x,player.y,player.w,player.h);
  // Musuh kotak hijau
  ctx.fillStyle="green"; enemies.forEach(e=>ctx.fillRect(e.x,e.y,30,50));
  // Peluru
  ctx.fillStyle="yellow"; bullets.forEach(b=>ctx.fillRect(b.x,b.y,10,4));
  // Ledakan kalau musuh mati
  if(enemies.length==0){
    ctx.fillStyle="orange"; ctx.font="40px Arial"; 
    ctx.fillText("MENANG!", canvas.width/2-80, 100);
  }
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
