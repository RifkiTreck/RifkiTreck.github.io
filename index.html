<audio id="rain" loop>
  <source src="https://cdn.pixabay.com/audio/2025/01/30/audio_ba4d8d3a9a.mp3" type="audio/mpeg">
</audio>

<script>
const cerita = `"Setiap baris kode adalah doa yang diketik jari, tapi tak semua doa bisa dijalankan."

Aku Rifki, seorang pemuda yang menghabiskan malamnya dengan layar terminal yang menyala redup...

Program dihentikan. Sisa kenangan: 100%. Kesedihan: Tidak bisa dihapus ❤️`;

let i = 0;
function ketik() {
  if (i < cerita.length) {
    document.getElementById("text").innerHTML += cerita.charAt(i);
    i++;
    setTimeout(ketik, 35);
  }
}
ketik();

// Tombol play/pause
document.getElementById("muteBtn").onclick = function() {
  let audio = document.getElementById("rain");
  if(audio.paused){
    audio.play();
    this.innerText = "🔊 MUTE";
  } else {
    audio.pause();
    this.innerText = "🔇 PLAY";
  }
}
</script>
