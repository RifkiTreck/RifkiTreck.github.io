<!DOCTYPE html>
<html>
<head>
<title>RC.COODING MOTOR 3D V2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;overflow:hidden;background:#000}
#gas{position:absolute;bottom:50px;right:50px;width:90px;height:90px;border-radius:50%;background:linear-gradient(red, darkred);color:white;font-size:22px;border:3px solid white;box-shadow:0 0 20px red}
#info{position:absolute;top:10px;left:10px;color:white;font-family:sans-serif;background:rgba(0,0,0,0.5);padding:5px;border-radius:5px}
</style>
</head>
<body>
<div id="info">RC.COODING MOTOR 3D V2</div>
<button id="gas">GAS</button>
<script type="importmap">{"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 10, 50);
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Lampu
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const light = new THREE.DirectionalLight(0xffffff, 0.8);
light.position.set(5,10,7); scene.add(light);

// Jalan bertekstur
const road = new THREE.Mesh(new THREE.PlaneGeometry(12,1000), new THREE.MeshLambertMaterial({color:0x2a2a2a}));
road.rotation.x = -Math.PI/2; scene.add(road);

// Garis + trotoar
for(let i=-500;i<500;i+=10){
  const line = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.01,4), new THREE.MeshBasicMaterial({color:0xffff00}));
  line.position.set(0,0.01,i); scene.add(line);
  const trotoarL = new THREE.Mesh(new THREE.BoxGeometry(1,0.2,1000), new THREE.MeshLambertMaterial({color:0x888}));
  trotoarL.position.set(-6,0.1,0); scene.add(trotoarL);
  const trotoarR = trotoarL.clone(); trotoarR.position.x = 6; scene.add(trotoarR);
}

// Motor 3D beneran
const motor = new THREE.Group();
const body = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.3,1.2), new THREE.MeshLambertMaterial({color:0xff0000}));
body.position.y = 0.3; motor.add(body);
const banD = new THREE.Mesh(new THREE.TorusGeometry(0.3,0.1), new THREE.MeshLambertMaterial({color:0x111}));
banD.position.set(0,0,0.4); banD.rotation.x = Math.PI/2; motor.add(banD);
const banB = banD.clone(); banB.position.z = -0.4; motor.add(banB);
motor.position.set(0,0,0); scene.add(motor);

// Pohon
for(let i=0;i<50;i++){
  const tree = new THREE.Group();
  const batang = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,1), new THREE.MeshLambertMaterial({color:0x8B4513}));
  const daun = new THREE.Mesh(new THREE.ConeGeometry(0.6,1.5), new THREE.MeshLambertMaterial({color:0x228B22}));
  daun.position.y = 1.2; tree.add(batang,daun);
  tree.position.set((Math.random()-0.5)*20,0,i*20-500); scene.add(tree);
}

camera.position.set(0,1.2,2); camera.lookAt(0,0.5,-5);
let speed = 0;
document.getElementById('gas').ontouchstart = () => speed = 1;
document.getElementById('gas').ontouchend = () => speed = 0;

function animate(){
  requestAnimationFrame(animate);
  road.position.z += speed;
  scene.children.forEach(obj => {if(obj.position) obj.position.z += speed});
  if(road.position.z > 500) road.position.z = 0;
  banD.rotation.y += speed*2; banB.rotation.y += speed*2;
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
