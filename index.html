<!DOCTYPE html>
<html>
<head>
<title>RC.COODING MOTOR 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;overflow:hidden;background:#000}
#gas{position:absolute;bottom:50px;right:50px;width:80px;height:80px;border-radius:50%;background:red;color:white;font-size:20px;border:none}
#info{position:absolute;top:10px;left:10px;color:white;font-family:sans-serif}
</style>
</head>
<body>
<div id="info">RC.COODING MOTOR 3D - Tahan GAS</div>
<button id="gas">GAS</button>
<script type="importmap">{"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Jalan
const road = new THREE.Mesh(new THREE.PlaneGeometry(10,500), new THREE.MeshBasicMaterial({color:0x444}));
road.rotation.x = -Math.PI/2; scene.add(road);

// Garis jalan
for(let i=-250;i<250;i+=8){
  const line = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.01,3), new THREE.MeshBasicMaterial({color:0xffff00}));
  line.position.set(0,0.01,i); scene.add(line);
}

// Stang motor
const handle = new THREE.Mesh(new THREE.TorusGeometry(0.5,0.1), new THREE.MeshBasicMaterial({color:0x222}));
handle.position.z = -1; handle.position.y = 0.5; scene.add(handle);

// Pohon
for(let i=0;i<20;i++){
  const tree = new THREE.Mesh(new THREE.ConeGeometry(0.5,2), new THREE.MeshBasicMaterial({color:0x0a0}));
  tree.position.set((Math.random()-0.5)*15,1,i*20-200); scene.add(tree);
}

camera.position.set(0,1,2);
let speed = 0;
document.getElementById('gas').ontouchstart = () => speed = 0.8;
document.getElementById('gas').ontouchend = () => speed = 0;

function animate(){
  requestAnimationFrame(animate);
  road.position.z += speed;
  scene.children.forEach(obj => {if(obj.geometry?.type=='BoxGeometry' && obj.position.y==0.01) obj.position.z += speed});
  if(road.position.z > 250) road.position.z = 0;
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
