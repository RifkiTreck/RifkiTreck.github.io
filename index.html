<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kode Yang Tak Pernah Selesai</title>
<style>
body {
  background: #0a0a0a;
  color: #00ff88;
  font-family: 'Courier New', monospace;
  padding: 40px 20px;
  line-height: 1.8;
  max-width: 800px;
  margin: auto;
}
h1 {
  color: #ffaa00;
  text-align: center;
  border-bottom: 2px solid #00ff88;
  padding-bottom: 10px;
}
.cursor {
  display: inline-block;
  width: 10px;
  background: #00ff88;
  animation: blink 1s infinite;
}
@keyframes blink { 50% { opacity: 0; }
#muteBtn {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #00ff88;
  color: #000;
  border: none;
  padding: 8px 12px;
  font-family: 'Courier New';
  cursor: pointer;
  font-size: 14px;
}
</style>
</head>
<body>

<button id="muteBtn">🔇 PLAY</button>
<h1>👨‍💻 WEAPON MENU</h1>
<div id="text"></div><span class="cursor"></span>

<audio id="rain" loop>
  <source src="https://cdn.pixabay.com/audio/2025/01/30/audio_ba4d8d3a9a.mp3" type="audio/mpeg">
</audio>

<script>
const cerita = `"Setiap baris kode adalah doa yang diketik jari, tapi tak semua doa bisa dijalankan."

Aku Rifki, seorang pemuda yang menghabiskan malamnya dengan layar terminal yang menyala redup...

Program dihentikan. Sisa kenangan: 100%. Kesedihan: Tidak bisa dihapus ❤️`;

let i = 0;
function ketik() {
  if (i < cerita.length) {
    document.getElementById("text").innerHTML += cerita.charAt(i);
    i++;
    setTimeout(ketik, 35);
  }
}
ketik();

document.getElementById("muteBtn").onclick = function() {
  let audio = document.getElementById("rain");
  if(audio.paused){
    audio.play();
    this.innerText = "🔊 MUTE";
  } else {
    audio.pause();
    this.innerText = "🔇 PLAY";
  }
}
</script>

</body>
</html>
