<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Tebak Kode</title>
<style>
body{background:#0a0a0a;color:#00ff88;font-family:'Courier New';text-align:center;padding:20px}
.kode{background:#111;border:1px solid #00ff88;padding:15px;margin:20px auto;text-align:left;max-width:500px}
button{background:#00ff88;color:#000;border:none;padding:10px 20px;margin:5px;cursor:pointer;font-weight:bold}
button:hover{background:#ffaa00}
#skor{color:#ffaa00;font-size:20px}
</style>
</head>
<body>
<h1>🔥 TEBAK OUTPUT KODE 🔥</h1>
<div>Skor: <span id="skor">0</span></div>

<div class="kode" id="soal"></div>

<button onclick="jawab(0)" id="btn0"></button>
<button onclick="jawab(1)" id="btn1"></button>
<button onclick="jawab(2)" id="btn2"></button>

<div id="hasil"></div>

<script>
let skor=0; let soalSekarang=0;
const soal = [
  {kode:`console.log(2 + 2 * 2);`, opsi:["6","8","4"], benar:0},
  {kode:`let a="Rifki"; console.log(a.length);`, opsi:["4","5","6"], benar:1},
  {kode:`console.log("10" + 5);`, opsi:["15","105","Error"], benar:1}
];

function loadSoal(){
  document.getElementById("soal").innerText = soal[soalSekarang].kode;
  document.getElementById("btn0").innerText = soal[soalSekarang].opsi[0];
  document.getElementById("btn1").innerText = soal[soalSekarang].opsi[1];
  document.getElementById("btn2").innerText = soal[soalSekarang].opsi[2];
  document.getElementById("hasil").innerText = "";
}

function jawab(pilih){
  if(pilih == soal[soalSekarang].benar){
    skor++; document.getElementById("hasil").innerText = "BENAR! +1 🔥";
  } else {
    document.getElementById("hasil").innerText = "SALAH! Jawaban: " + soal[soalSekarang].opsi[soal[soalSekarang].benar];
  }
  document.getElementById("skor").innerText = skor;
  soalSekarang = (soalSekarang+1) % soal.length;
  setTimeout(loadSoal, 1500);
}
loadSoal();
</script>
</body>
</html>
